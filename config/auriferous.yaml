system:
  name: 'Auriferous'
  mode: 'paper'
  log_level: 'INFO'
  base_currency: 'USD'

capital:
  initial_usd: 2450
  option_bucket_pct: 0.65
  futures_bucket_pct: 0.25
  cash_buffer_pct: 0.10

broker:
  host: '127.0.0.1'
  port: 4002
  client_id: 10
  timeout_seconds: 30
  readonly: false
  market_data_type: 1

database:
  type: 'postgresql'
  host: 'localhost'
  port: 5432
  name: 'auriferous'

llm:
  provider: 'openai'
  model: 'gpt-5'
  fast_model: 'gpt-5-mini'
  temperature: 0.3
  max_tokens: 4096
  timeout_seconds: 300

sentinel:
  poll_seconds: 30
  volume_anomaly_ratio: 4.0
  volume_anomaly_atr_mult: 1.5
  edgar_items: ['1.01', '1.03', '2.02', '4.01', '4.02', '5.02', '7.01', '8.01']
  halt_codes: ['T1', 'T12', 'LUDP']
  pdufa_window_days: [-5, 2]
  contact_email: 'kyyk1487@gmail.com'

jobs:
  sentinel_seconds: 30
  pdufa_refresh_seconds: 604800
  universe_refresh_seconds: 604800
  earnings_refresh_seconds: 86400
  pdufa_lookback_days: 180
  universe_refresh_enabled: false

triage:
  min_expected_move_pct: 8.0
  max_per_day: 400
  max_per_hour: 60

swarm:
  redteam_kill_threshold: 0.70
  pricedin_veto_threshold: 0.65
  min_conviction: 0.55

structurer:
  max_spread_pct: 0.12
  min_open_interest: 250
  min_volume: 25
  min_days_to_expiry: 14
  event_expiry_buffer_days: 7
  target_delta_min: 0.35
  target_delta_max: 0.45
  spread_long_delta: 0.45
  spread_short_delta: 0.20
  iv_rank_spread_threshold: 60
  iv_rank_skip_threshold: 80
  max_premium_pct_of_equity: 0.10
  max_stock_price: 200.0

risk:
  kelly_fraction: 0.25
  fallback_hit_rate: 0.35
  min_calibration_n: 15
  max_position_pct: 0.10
  max_total_premium_pct: 0.35
  max_concurrent_options: 6
  max_concurrent_futures: 2
  max_same_catalyst_type: 2
  max_same_sector: 2
  drawdown_caution: 0.10
  drawdown_defensive: 0.20
  drawdown_halt: 0.30

positions:
  option_stop_premium_pct: -0.60
  scale_out_at_gain_pct: 1.00
  scale_out_fraction: 0.50
  theta_exit_days: 7
  futures_atr_stop_mult: 2.5
  bff_roll_hour_utc: 20
  bff_roll_weekday: 3

shadow:
  enabled: true
  parallel_book_enabled: true

universe:
  min_market_cap: 300000000
  max_market_cap: 10000000000
  min_dollar_volume: 3000000
  min_price: 3.0
  max_price: 200.0
  min_total_open_interest: 1000
  refresh_days: 7
